[project]
name = "bug-hunt"
version = "0.1.0"
description = "Debugging-practice simulator backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "e2b>=1.0",
    "passlib>=1.7.4",
    # passlib 1.7.4 probes the bcrypt backend at import: 4.1+ dropped the
    # __about__ attribute it reads (logs a traceback on every startup) and 5.x
    # raises on the >72-byte secret the probe itself uses. Both bounds go away
    # if passlib ever ships a release past 1.7.4.
    "bcrypt>=4.0,<4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["api/tests", "scenario_engine/tests", "sandbox/tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "scenario_engine", "sandbox"]
